# Deploy after changing these settings; this is not a live website control panel.
aws:
  region: eu-west-1
project:
  tagKey: Project
  tagValue: Weiqi
budget:
  monthlyUsd: 50
  dailyUsd: 15
  # AI stays paused until an administrator deliberately resumes it.
analysis:
  dailyGameLimit: 10
  quickVisits: 32
  # Deep visits per position, chosen so a 250-move game takes about 45-60 minutes.
  # A10G On-Demand is tried first; the Spot pool and the T4 backup use the T4 setting.
  deepVisitsA10G: 12000
  deepVisitsT4: 5000
  capacityFallbackSeconds: 180
  jobTimeoutSeconds: 7200

positionAnalysis:
  # Shared worldwide allowance for photo detection and cloud position analysis.
  # Each request reserves more than its maximum worker/runtime cost.
  dailyUsd: 3
  requestReserveMicros: 3000
  recognitionMemoryMb: 1769
  recognitionTimeoutSeconds: 25
  aiMemoryMb: 3008
  aiTimeoutSeconds: 20
  aiVisits: 300
