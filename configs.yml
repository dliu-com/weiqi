# Deploy after changing these settings; this is not a live website control panel.
aws:
  region: eu-west-1
project:
  tagKey: Project
  tagValue: Weiqi
budget:
  monthlyUsd: 50
  dailyUsd: 15
  # AI stays paused until an administrator deliberately resumes it.
analysis:
  # Per London day: up to 100 new games (IDs end 00-99). Every game gets quick
  # analysis on T4 (about US$0.05); only the first 10 also get deep analysis.
  dailyGameLimit: 100
  dailyDeepLimit: 10
  quickVisits: 32
  # Deep visits per position on every GPU. A 250-move game takes about 15 minutes
  # on A10G and 36 minutes on T4; results stay close to 12,000 visits.
  deepVisits: 3000
  capacityFallbackSeconds: 180
  jobTimeoutSeconds: 7200

positionAnalysis:
  # Photo detection and cloud position analysis share these allowances per UTC
  # day: site-wide, and per connection.
  dailyRequests: 2000
  connectionDailyRequests: 500
  # Each request reserves US$0.0015, more than its maximum cost (about US$0.0013
  # for a 20 s run), so the site-wide maximum is 2,000 x US$0.0015 = US$3 a day.
  requestReserveMicros: 1500
  # 3538 MB gives 2 vCPUs: photos read in about 6 s instead of 9 s for about 17% more cost.
  recognitionMemoryMb: 3538
  recognitionTimeoutSeconds: 20
  aiMemoryMb: 3008
  aiTimeoutSeconds: 20
  aiVisits: 300
