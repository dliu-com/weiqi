<!doctype html><html lang="zh-CN"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Record game · DL Weiqi</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="https://files.dliu.com/dliu.com/ui/v1/dl.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site.css"></head><body class="dl-page editor-page"><header class="dl-header"></header><main class="dl-main workspace" id="editor-main"><section class="play-area"><div class="board-wrap"><div id="board" role="group" aria-label="Game recording board"></div></div><div class="review-controls editor-navigation"><button id="editor-first" class="dl-button">|←</button><button id="editor-back-ten" class="dl-button">−10</button><button id="editor-prev" class="dl-button">←</button><span id="editor-move" class="move-label"></span><button id="editor-next" class="dl-button">→</button><button id="editor-forward-ten" class="dl-button">+10</button><button id="editor-last" class="dl-button">→|</button></div></section><aside class="workspace-panel"><div class="editor-heading"><h1 id="editor-title"></h1><span id="draft-status" role="status" hidden></span></div><div class="editor-upload-box"><button type="button" id="editor-upload-label" class="dl-button"></button><input id="editor-file" type="file" accept=".sgf,application/x-go-sgf" hidden></div><p id="editor-notice" role="alert"></p><div id="draft-conflict" class="draft-conflict" role="alert" hidden><p id="draft-conflict-text"></p><button id="draft-reload" type="button" class="dl-button"></button></div><section class="editor-tree-panel"><h2 id="editor-tree-title"></h2><p id="editor-tree-help"></p><div id="editor-tree" role="group" aria-label="Game tree"></div></section><section id="sequence-edit-panel" class="sequence-edit-panel" hidden><h2 id="sequence-edit-title"></h2><p id="sequence-edit-help"></p><div class="actions sequence-edit-tools"><button id="editor-delete" class="dl-button"></button><button id="editor-insert" aria-pressed="false" class="dl-button"></button><button id="editor-reposition" aria-pressed="false" class="dl-button"></button></div><p id="sequence-edit-preview" role="status"></p><div class="actions"><button id="sequence-edit-apply" class="dl-button dl-button-primary"></button><button id="sequence-edit-cancel" class="dl-button"></button></div></section><div class="editor-toolbar"><button id="editor-edit-sequence" class="dl-button"></button><button id="editor-pass" class="dl-button"></button><button id="editor-clear" class="dl-button"></button><button id="editor-rotate" class="dl-button"></button></div><div id="editor-sound"></div><div class="editor-file-actions"><button id="editor-save" class="dl-button dl-button-primary"></button></div><p id="editor-save-help" class="editor-save-help"></p><section class="game-details-editor"><h2 id="details-summary"></h2><form id="editor-details"><label><span id="label-title"></span><input name="name" maxlength="80" required></label><label><span id="label-date"></span><input name="date" required type="date"></label><label><span id="label-black"></span><input name="black" required maxlength="40"></label><label><span id="label-white"></span><input name="white" required maxlength="40"></label><label><span id="label-black-rank"></span><input name="blackRank" maxlength="200" placeholder="1d / 5k"></label><label><span id="label-white-rank"></span><input name="whiteRank" maxlength="200" placeholder="1d / 5k"></label><label><span id="label-venue"></span><input name="venue" maxlength="200"></label><label><span id="label-rules"></span><select name="rules" required><option value="Japanese"></option><option value="Chinese"></option><option value="Korean"></option><option value="AGA"></option></select></label><label><span id="label-handicap"></span><select name="handicap" required><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label><label><span id="label-komi"></span><input name="komi" required type="number" min="-100" max="100" step="0.5"></label><label><span id="label-result"></span><select name="result" required><option value="B"></option><option value="W"></option><option value="0"></option></select></label><label id="result-reason-field" hidden><span id="label-result-reason"></span><select name="resultReason" disabled><option value=""></option><option value="T"></option><option value="R"></option><option value="points"></option></select></label><label id="result-margin-field" hidden><span id="label-result-margin"></span><input name="resultMargin" type="number" min="0.001" max="1000" step="any" disabled></label></form></section></aside></main><dialog id="editor-confirm" class="dl-dialog" aria-labelledby="editor-confirm-title"><div class="dl-dialog-head"><h2 id="editor-confirm-title"></h2></div><div class="dl-dialog-body"><p id="editor-confirm-text"></p></div><div class="dl-dialog-actions"><button id="editor-cancel" class="dl-button"></button><button id="editor-accept" class="dl-button dl-button-primary"></button></div></dialog><footer class="dl-footer"><a class="dl-footer-logo" href="https://dliu.com" aria-label="dliu.com"><img src="https://files.dliu.com/dliu.com/favicon.png" alt="" width="24" height="24"></a><a href="https://dliu.com">dliu.com</a> · <a href="/" data-zh="DL 围棋" data-en="DL Weiqi">DL 围棋</a> · <a href="/guide" data-zh="使用指南" data-en="User guide">使用指南</a> · <a href="/docs" data-zh="文档" data-en="Docs">文档</a></footer><script type="module" src="editor.js"></script></body></html>
