<!doctype html><html lang="zh-CN"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Record game · DL Weiqi</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site.css"><link rel="icon" href="favicon.svg"></head><body class="editor-page"><header></header><main class="workspace" id="editor-main"><section class="play-area"><div class="board-wrap"><div id="board" role="group" aria-label="Game recording board"></div></div><div class="review-controls editor-navigation"><button id="editor-first">|←</button><button id="editor-back-ten">−10</button><button id="editor-prev">←</button><span id="editor-move"></span><button id="editor-next">→</button><button id="editor-forward-ten">+10</button><button id="editor-last">→|</button></div></section><aside class="workspace-panel"><div class="editor-heading"><h1 id="editor-title"></h1><span id="draft-status" role="status" hidden></span></div><div class="editor-upload-box"><button type="button" id="editor-upload-label"></button><input id="editor-file" type="file" accept=".sgf,application/x-go-sgf" hidden></div><p id="editor-notice" role="alert"></p><section class="editor-tree-panel"><h2 id="editor-tree-title"></h2><p id="editor-tree-help"></p><div id="editor-tree" role="group" aria-label="Game tree"></div></section><div class="editor-toolbar"><button id="editor-pass"></button><button id="editor-delete"></button><button id="editor-reposition" aria-pressed="false"></button><button id="editor-insert" aria-pressed="false"></button><button id="editor-clear"></button><button id="editor-rotate"></button></div><div class="editor-file-actions"><button id="editor-save" class="primary"></button><button id="draft-reload" hidden></button></div><p id="editor-save-help" class="editor-save-help"></p><section class="game-details-editor"><h2 id="details-summary"></h2><form id="editor-details"><label><span id="label-title"></span><input name="name" maxlength="80" required></label><label><span id="label-black"></span><input name="black" required maxlength="40"></label><label><span id="label-white"></span><input name="white" required maxlength="40"></label><label><span id="label-date"></span><input name="date" required type="date"></label><label><span id="label-rules"></span><select name="rules" required><option value="Japanese"></option><option value="Chinese"></option><option value="Korean"></option><option value="AGA"></option><option value="Other"></option></select></label><label><span id="label-komi"></span><input name="komi" required type="number" min="-100" max="100" step="0.5"></label><label><span id="label-handicap"></span><select name="handicap" required><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label><label><span id="label-result"></span><select name="result" required><option value="0"></option><option value="B+"></option><option value="W+"></option><option value="B+R"></option><option value="W+R"></option><option value="original"></option></select></label></form></section></aside></main><dialog id="editor-confirm"><h2 id="editor-confirm-title"></h2><p id="editor-confirm-text"></p><div class="actions"><button id="editor-cancel"></button><button id="editor-accept" class="primary"></button></div></dialog><script type="module" src="editor.js"></script></body></html>
