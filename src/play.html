<!doctype html>
<html lang="zh-CN"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152b26"><meta name="description" content="十九路围棋，双人对弈。云端保存，多设备同步。"><title>围棋 · DL</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site.css"></head>
<body class="play-page"><header></header>
<div class="game-meta"><button disabled id="new" class="primary">结束棋局</button><div><strong id="game-name"></strong><p id="player-names"></p></div><button id="edit-game">编辑名称</button><button id="download-sgf">下载 SGF</button><a href="/game" id="history-link">棋谱库</a></div><main><section class="play-area"><div class="board-heading"><div><span class="eyebrow">WEIQI / 19 × 19</span><h1>黑白之间</h1></div><button id="focus" aria-pressed="false">专注棋盘 ↗</button></div>
<div class="board-wrap"><div id="board" role="group" aria-label="十九路围棋棋盘，方向键移动，回车落子"></div></div>
</section><aside><div class="status-card"><p id="sync-warning" role="alert" hidden></p><span class="eyebrow">此刻棋局</span><h2 id="turn" aria-live="polite">正在载入…</h2><p id="detail">正在连接云端棋局</p><div class="game-clock"><span id="black-time"></span><span id="white-time"></span><button id="pause-clock" type="button">暂停计时</button><small id="clock-note"></small></div><div class="stats"><div>黑方提子<strong id="black-captures">0</strong></div><div>白方提子<strong id="white-captures">0</strong></div></div><div class="actions"><button disabled id="pass" class="primary">停一手</button><button disabled id="undo">悔棋</button><button disabled id="resign-black" data-side="black">黑方认输</button><button disabled id="resign-white" data-side="white">白方认输</button></div></div>
<div id="scoring" class="card" hidden><h3>终局数子</h3><p id="scoring-help">请标记所有死子，然后点击确认查看胜负。</p><p id="score"></p><div id="scoring-actions" class="actions"><button id="confirm-score" class="primary">确认死子</button><button id="resume">继续对弈</button></div></div>
<div class="card sync-card"><label><input id="auto" type="checkbox" checked> 自动同步 <span>每 5 秒</span></label><p id="sync" role="status">正在连接…</p><button id="refresh">立即同步</button><small>连续 10 分钟无落子，自动暂停同步。</small></div>
<div class="card history-card"><h3>落子记录 <span id="count">0 手</span></h3><p id="review-status" role="status"></p><div class="review-controls"><button id="review-start" type="button">|←</button><button id="review-prev" type="button">←</button><button id="review-next" type="button">→</button><button id="review-live" type="button">返回当前棋局</button></div><div id="trial-controls" class="review-controls" hidden><button id="trial-undo" type="button">撤回试下</button><button id="trial-reset" type="button">清除试下</button></div><div id="history" role="group" aria-label="Move tree / 棋谱树"></div><p id="empty">黑先白后，从第一手开始。</p></div></aside></main>
<p id="notice" role="alert" hidden></p>

<dialog id="end-game-dialog" class="agreed-result"><h2 id="result-label">结束棋局并自动保存</h2><div class="actions"><button id="result-black">黑方获胜</button><button id="result-white">白方获胜</button><button id="result-draw">和棋 / 未完成</button></div><button id="end-game-cancel">取消</button></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="actions"><button id="cancel-confirm">取消</button><button id="accept-confirm" class="primary">确认</button></div></dialog>
<dialog id="edit-dialog"><h2>棋局信息</h2><form id="edit-form"><label>棋局名称<input id="name-input" maxlength="80" required></label><label>黑方棋手<input id="black-input" maxlength="40"></label><label>白方棋手<input id="white-input" maxlength="40"></label><label><span id="live-date-label">日期</span><input id="live-date" type="date"></label><label><span id="live-rules-label">规则</span><select id="live-rules"><option value="Chinese">中国规则</option><option value="Japanese">日本规则</option></select></label><label><span id="live-komi-label">贴目</span><input id="live-komi" type="number" step="0.5" min="-100" max="100"></label><p id="edit-error" role="alert"></p><div class="actions"><button type="button" id="cancel-edit">取消</button><button type="submit" id="save-edit">保存</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
