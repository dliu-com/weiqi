<!doctype html>
<html lang="zh-CN"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152b26"><meta name="description" content="十九路围棋，双人对弈。云端保存，多设备同步。"><title>围棋 · DL</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site.css"></head>
<body class="play-page"><header></header>
<main id="play-main" class="workspace"><section class="play-area">
<div class="board-wrap"><div id="board" role="group" aria-label="十九路围棋棋盘，方向键移动，回车落子"></div></div>
<div class="review-controls editor-navigation live-navigation"><button id="review-start" type="button">|←</button><button id="review-prev" type="button">←</button><button id="review-next" type="button">→</button><button id="review-live" type="button">返回当前棋局</button></div>
</section><aside class="workspace-panel"><div class="game-meta"><button disabled id="new" class="primary">新一局</button><div><h1 id="game-name"></h1></div><button id="edit-game">编辑棋局信息</button><button id="download-sgf">下载 SGF</button></div><div class="status-card"><p id="sync-warning" role="alert" hidden></p><h2 id="turn" aria-live="polite">正在载入…</h2><div class="player-boxes"><div id="black-box" class="player-box"><span class="player-box-side player-box-black"><span id="black-box-label" class="player-box-name">黑方</span><small id="black-box-rank"></small></span><span id="black-time" class="player-box-time"></span><span class="player-box-captures"><span id="black-captures-label">提子</span> <strong id="black-captures">0</strong></span><small id="black-periods" class="player-box-periods" hidden></small></div><div id="white-box" class="player-box"><span class="player-box-side player-box-white"><span id="white-box-label" class="player-box-name">白方</span><small id="white-box-rank"></small></span><span id="white-time" class="player-box-time"></span><span class="player-box-captures"><span id="white-captures-label">提子</span> <strong id="white-captures">0</strong></span><small id="white-periods" class="player-box-periods" hidden></small></div></div><p id="detail">正在连接云端棋局</p><div class="game-clock"><button id="pause-clock" type="button">暂停计时</button><small id="clock-note"></small></div><div class="actions"><button disabled id="pass" class="primary">停一手</button><button disabled id="undo">悔棋</button><button disabled id="resign-black" data-side="black">黑方认输</button><button disabled id="resign-white" data-side="white">白方认输</button></div></div>
<div id="scoring" class="card" hidden><h3>终局数子</h3><p id="scoring-help">请标记所有死子，然后点击确认查看胜负。</p><p id="score"></p><div id="scoring-actions" class="actions"><button id="confirm-score" class="primary">确认死子</button><button id="resume">继续对弈</button></div></div>
<div id="play-sound" class="card"></div><div class="card sync-card"><label><input id="auto" type="checkbox" checked> 自动同步</label><p id="sync">正在连接…</p></div>
<div class="card history-card"><h3>落子记录 <span id="count">0 手</span></h3><p id="review-status" role="status"></p><div id="trial-controls" class="review-controls" hidden><button id="trial-undo" type="button">撤回试下</button><button id="trial-reset" type="button">清除试下</button></div><div id="history" role="group" aria-label="Move tree / 棋谱树"></div></div></aside></main>
<p id="notice" role="alert" hidden></p>

<dialog id="end-game-dialog" class="end-game"><form id="end-game-form" method="dialog" novalidate><h2 id="result-label">本局结果</h2><p id="result-count-summary" class="result-summary"></p><p id="result-count-winner" class="result-winner"></p><fieldset id="result-options" class="result-options" aria-label="结果"><label class="result-row" data-row="score-black"><input type="radio" name="result" value="score-black"><span id="result-score-black-text">黑方胜</span><input id="margin-black" class="margin" type="number" min="0.5" max="400" step="0.5" inputmode="decimal"><span class="result-unit">目</span></label><label class="result-row" data-row="score-white"><input type="radio" name="result" value="score-white"><span id="result-score-white-text">白方胜</span><input id="margin-white" class="margin" type="number" min="0.5" max="400" step="0.5" inputmode="decimal"><span class="result-unit">目</span></label><label class="result-row" data-row="resign-black"><input type="radio" name="result" value="resign-black"><span id="result-resign-black-text">黑方中盘胜</span></label><label class="result-row" data-row="resign-white"><input type="radio" name="result" value="resign-white"><span id="result-resign-white-text">白方中盘胜</span></label><label class="result-row" data-row="draw"><input type="radio" name="result" value="draw"><span id="result-draw-text">和棋</span></label><label class="result-row" data-row="unfinished"><input type="radio" name="result" value="unfinished"><span id="result-unfinished-text">未完成</span></label></fieldset><p id="result-short" class="result-short" hidden></p><div class="actions"><button type="button" id="end-game-cancel">取消</button><button type="submit" id="end-game-confirm" class="primary">保存并开始新一局</button></div></form></dialog>
<dialog id="resigned-dialog"><h2 id="resigned-title"></h2><p id="resigned-text"></p><div class="actions"><button id="resigned-close">关闭</button><button id="resigned-open" class="primary">打开棋谱</button></div></dialog><dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="actions"><button id="cancel-confirm">取消</button><button id="accept-confirm" class="primary">确认</button></div></dialog>
<dialog id="edit-dialog"><h2>棋局信息</h2><form id="edit-form"><label>棋局名称<input id="name-input" maxlength="80" required></label><div class="edit-pair"><label>黑方棋手<input id="black-input" maxlength="40"></label><label><span id="live-black-rank-label">段级位</span><input id="black-rank-input" maxlength="200" placeholder="1d / 5k"></label></div><div class="edit-pair"><label>白方棋手<input id="white-input" maxlength="40"></label><label><span id="live-white-rank-label">段级位</span><input id="white-rank-input" maxlength="200" placeholder="1d / 5k"></label></div><div class="rules-field"><span id="live-rules-label">规则</span><div id="live-rules-choice" class="rules-choice" role="group" aria-labelledby="live-rules-label"><button type="button" data-rules="Chinese" aria-pressed="true">中国规则</button><button type="button" data-rules="Japanese" aria-pressed="false">日本规则</button></div><input type="hidden" id="live-rules" value="Chinese"></div><div class="edit-pair"><label><span id="live-handicap-label">让子</span><select id="live-handicap"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select></label><div class="komi-field"><span id="live-komi-label">贴目</span><output id="live-komi" for="live-rules live-handicap">黑贴 7.5 目</output></div></div><div class="rules-field"><span id="live-time-label">用时</span><div id="live-time-choice" class="rules-choice" role="group" aria-labelledby="live-time-label"><button type="button" data-time="count" aria-pressed="true">正计时</button><button type="button" data-time="byoyomi" aria-pressed="false">读秒</button></div><input type="hidden" id="live-time" value="count"><div id="live-byoyomi" class="byoyomi-fields" hidden><label><span id="live-main-label">基本用时（分钟）</span><input id="live-main" type="number" min="0" max="600" step="1" value="30"></label><label><span id="live-periods-label">读秒次数</span><input id="live-periods" type="number" min="1" max="100" step="1" value="3"></label><label><span id="live-period-label">每次（秒）</span><input id="live-period" type="number" min="1" max="3600" step="1" value="30"></label></div><small id="live-time-hint" class="field-hint">不限时，记录双方用时。</small></div><p id="edit-error" role="alert"></p><div class="actions"><button type="button" id="cancel-edit">取消</button><button type="submit" id="save-edit">保存</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
