<!doctype html><html lang="zh-CN"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棋谱 · DL</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="site.css"></head><body class="record-page"><header></header><p id="record-message" class="record-message" role="status"></p><main id="record-main"><section class="play-area"><div class="board-wrap"><div id="board" role="group" aria-label="Go record board"></div></div><div id="trial-controls" class="review-controls" hidden><button id="trial-undo"></button><button id="trial-clear"></button></div><label id="branch-label" for="branch-select"></label><select id="branch-select" hidden></select></section><aside><section class="record-summary"><div class="game-meta"><strong id="record-name"></strong><div class="record-file-actions"><button id="download-original" class="record-file-button">下载 SGF</button><a id="generate-report" class="record-file-button" aria-disabled="true">查看 AI 报告</a></div></div><p id="record-details"></p><div class="board-heading"><div id="record-players"></div></div><div class="review-controls record-navigation"><button id="first" aria-label="First position">|←</button><button id="back-ten" aria-label="Back 10 moves">−10</button><button id="previous" aria-label="Previous move">←</button><span id="move-label" class="move-label"></span><button id="next" aria-label="Next move">→</button><button id="forward-ten" aria-label="Forward 10 moves">+10</button><button id="last" aria-label="Last position">→|</button></div><div id="game-sound"></div></section><section class="card evaluation-card"><div id="analysis-wait" role="status"><span class="analysis-spinner" aria-hidden="true"></span><p id="analysis-status"></p></div><div id="chart-panel" class="chart-panel"><div class="chart-head"><p id="chart-legend"><span class="chart-key chart-key-black" aria-hidden="true"></span><span id="legend-black"></
